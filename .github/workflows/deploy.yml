name: Deploy

# Caminho B: GitHub Actions = orquestrador, CodePipeline = deploy worker.
#
# Como funciona:
#   - O CodePipeline `<app>-devqa` é disparado por push em develop (trigger nativo CodeStar).
#   - Este workflow OBSERVA a execução do pipeline AWS:
#     * Quando o pipeline atinge "Approval_To_QA" (Pending), o workflow trava no Environment
#       "qa" do GitHub. Quando o reviewer aprova lá, o workflow chama put-approval-result
#       no CodePipeline e o pipeline destrava.
#     * Mesma coisa pra "Approval_To_Main_PR" (Environment "prod").
#   - Após Open_PR (lambda do CodePipeline criar PR develop->main), este workflow merja o PR
#     e chama o pipeline `<app>-prod` via start-pipeline-execution.
#
# Hotfix / rollback continuam sendo workflow_dispatch e fazem o caminho mais direto.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Tipo de operação"
        required: true
        type: choice
        options:
          - feature
          - hotfix
          - rollback
      image_tag:
        description: "(rollback) Tag da imagem ECR (vazio = lista 20 últimas)"
        required: false
        type: string
        default: ""
      hotfix_branch:
        description: "(hotfix) Nome da branch hotfix/* já criada de main com PR para main"
        required: false
        type: string
        default: ""
  push:
    branches: [ develop ]

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: kabum-poc-cluster
  CONTAINER_NAME: app
  APP_NAME: ${{ github.event.repository.name }}

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: deploy-${{ github.event.repository.name }}
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      operation: ${{ steps.set.outputs.operation }}
      image_tag: ${{ steps.set.outputs.image_tag }}
      hotfix_branch: ${{ steps.set.outputs.hotfix_branch }}
    steps:
      - id: set
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "operation=feature" >> "$GITHUB_OUTPUT"
          else
            echo "operation=${{ github.event.inputs.operation }}" >> "$GITHUB_OUTPUT"
            echo "image_tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
            echo "hotfix_branch=${{ github.event.inputs.hotfix_branch }}" >> "$GITHUB_OUTPUT"
          fi

  # =========================================================================
  # FLUXO FEATURE (CodePipeline-driven)
  # =========================================================================

  # Job 1: encontra a execução do CodePipeline disparada pelo push em develop
  #        e aguarda chegar em Approval_To_QA.
  feature-wait-qa-approval:
    needs: decide
    if: needs.decide.outputs.operation == 'feature'
    runs-on: ubuntu-latest
    outputs:
      execution_id: ${{ steps.find.outputs.execution_id }}
      commit_sha: ${{ steps.find.outputs.commit_sha }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find CodePipeline execution for this commit
        id: find
        run: |
          set -euo pipefail
          COMMIT="${{ github.sha }}"
          PIPELINE="${APP_NAME}-devqa"
          echo "Looking for pipeline execution for commit ${COMMIT:0:12}…"

          EXEC_ID=""
          for attempt in $(seq 1 30); do
            # Pega 1 página inteira (10 últimas execuções) em JSON e filtra com jq.
            # Isso evita o problema de --max-items emitir 'None' na próxima página.
            CANDIDATE=$(aws codepipeline list-pipeline-executions \
              --pipeline-name "$PIPELINE" \
              --query 'pipelineExecutionSummaries[].{id:pipelineExecutionId,rev:sourceRevisions[0].revisionId}' \
              --output json 2>/dev/null \
              | jq -r --arg c "$COMMIT" '[.[] | select(.rev != null and (.rev == $c or (.rev | startswith($c))))][0].id // empty')
            if [[ -n "$CANDIDATE" ]]; then
              EXEC_ID="$CANDIDATE"
              echo "Found: $EXEC_ID"
              break
            fi
            echo "  not yet (attempt $attempt/30), sleeping 10s…"
            sleep 10
          done

          if [[ -z "$EXEC_ID" ]]; then
            echo "::error::Pipeline execution não encontrada para $COMMIT após 5min"
            exit 1
          fi

          echo "execution_id=$EXEC_ID" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$COMMIT"   >> "$GITHUB_OUTPUT"

      - name: Wait until Approval_To_QA is Pending
        env:
          PIPELINE: ${{ env.APP_NAME }}-devqa
          EXEC: ${{ steps.find.outputs.execution_id }}
        run: |
          set -euo pipefail
          echo "Waiting for stage Approval_To_QA to reach 'InProgress' (pending approval)…"
          for attempt in $(seq 1 60); do
            STATE=$(aws codepipeline get-pipeline-state --name "$PIPELINE" \
              --query "stageStates[?stageName=='Approval_To_QA'].latestExecution.status | [0]" \
              --output text)
            STAGE_EXEC=$(aws codepipeline get-pipeline-state --name "$PIPELINE" \
              --query "stageStates[?stageName=='Approval_To_QA'].latestExecution.pipelineExecutionId | [0]" \
              --output text)
            echo "  attempt $attempt: state=$STATE exec=$STAGE_EXEC"

            # Confirma que o estado pertence a NOSSA execução
            if [[ "$STAGE_EXEC" == "$EXEC" && "$STATE" == "InProgress" ]]; then
              echo "Approval pending."
              exit 0
            fi
            if [[ "$STATE" == "Failed" || "$STATE" == "Cancelled" ]]; then
              echo "::error::Pipeline stage failed/cancelled before reaching approval"
              exit 1
            fi
            sleep 15
          done
          echo "::error::Timeout aguardando Approval_To_QA"
          exit 1

  # Job 2: Environment "qa" — required reviewer aprova aqui no GitHub.
  #        Quando o reviewer aprova, este job chama put-approval-result no CodePipeline
  #        e o estágio Approval_To_QA do CodePipeline destrava.
  feature-approve-qa:
    needs: [ feature-wait-qa-approval ]
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Send Approved to CodePipeline
        env:
          PIPELINE: ${{ env.APP_NAME }}-devqa
          EXEC: ${{ needs.feature-wait-qa-approval.outputs.execution_id }}
        run: |
          set -euo pipefail
          TOKEN=$(aws codepipeline get-pipeline-state --name "$PIPELINE" \
            --query "stageStates[?stageName=='Approval_To_QA']" --output json \
            | jq -r '.[0].actionStates[] | select(.actionName=="Manual_Approval_QA") | .latestExecution.token // empty')
          if [[ -z "$TOKEN" ]]; then
            echo "::error::Token de approval não encontrado"
            exit 1
          fi
          aws codepipeline put-approval-result \
            --pipeline-name "$PIPELINE" \
            --stage-name Approval_To_QA \
            --action-name Manual_Approval_QA \
            --token "$TOKEN" \
            --result summary="Approved via GitHub Environment by ${{ github.actor }}",status=Approved
          echo "Approved."

  # Job 3: Kiro review entre Deploy_Dev e Approval_To_QA.
  #        Como Approval_To_QA já aconteceu, vai rodar em paralelo com o Deploy_QA do CodePipeline.
  feature-kiro-review:
    needs: [ feature-wait-qa-approval ]
    uses: ./.github/workflows/kiro-review.yml
    with:
      commit_sha: ${{ needs.feature-wait-qa-approval.outputs.commit_sha }}
      image_tag:  ${{ needs.feature-wait-qa-approval.outputs.commit_sha }}
    secrets: inherit

  # Job 4: aguarda Approval_To_Main_PR ficar pending
  feature-wait-prod-approval:
    needs: [ feature-approve-qa ]
    runs-on: ubuntu-latest
    outputs:
      execution_id: ${{ needs.feature-wait-qa-approval.outputs.execution_id }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Wait until Approval_To_Main_PR is Pending
        env:
          PIPELINE: ${{ env.APP_NAME }}-devqa
          EXEC: ${{ needs.feature-wait-qa-approval.outputs.execution_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            STATE=$(aws codepipeline get-pipeline-state --name "$PIPELINE" \
              --query "stageStates[?stageName=='Approval_To_Main_PR'].latestExecution.status | [0]" \
              --output text)
            STAGE_EXEC=$(aws codepipeline get-pipeline-state --name "$PIPELINE" \
              --query "stageStates[?stageName=='Approval_To_Main_PR'].latestExecution.pipelineExecutionId | [0]" \
              --output text)
            echo "  attempt $attempt: state=$STATE exec=$STAGE_EXEC"
            if [[ "$STAGE_EXEC" == "$EXEC" && "$STATE" == "InProgress" ]]; then
              exit 0
            fi
            if [[ "$STATE" == "Failed" || "$STATE" == "Cancelled" ]]; then
              echo "::error::Pipeline stage failed/cancelled before reaching prod approval"
              exit 1
            fi
            sleep 15
          done
          echo "::error::Timeout aguardando Approval_To_Main_PR"
          exit 1

  # Job 5: Environment "prod" — required reviewer aprova abertura de PR develop->main.
  feature-approve-prod:
    needs: [ feature-wait-prod-approval, feature-wait-qa-approval ]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Send Approved to CodePipeline
        env:
          PIPELINE: ${{ env.APP_NAME }}-devqa
          EXEC: ${{ needs.feature-wait-qa-approval.outputs.execution_id }}
        run: |
          set -euo pipefail
          TOKEN=$(aws codepipeline get-pipeline-state --name "$PIPELINE" \
            --query "stageStates[?stageName=='Approval_To_Main_PR']" --output json \
            | jq -r '.[0].actionStates[] | select(.actionName=="Manual_Approval_Open_PR") | .latestExecution.token // empty')
          if [[ -z "$TOKEN" ]]; then
            echo "::error::Token de approval (prod) não encontrado"
            exit 1
          fi
          aws codepipeline put-approval-result \
            --pipeline-name "$PIPELINE" \
            --stage-name Approval_To_Main_PR \
            --action-name Manual_Approval_Open_PR \
            --token "$TOKEN" \
            --result summary="Approved via GitHub Environment by ${{ github.actor }}",status=Approved
          echo "Approved. Lambda OpenPR vai criar o PR develop->main."

  # Job 6: aguarda PR develop->main ser criado pela Lambda OpenPR, merja, dispara <app>-prod
  feature-merge-and-deploy-prod:
    needs: [ feature-approve-prod ]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for develop->main PR
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FOR_MERGE }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            PR_NUM=$(gh pr list --repo "${{ github.repository }}" --base main --state open \
              --json number,headRefName --jq '[.[] | select(.headRefName=="qa")][0].number')
            if [[ -n "${PR_NUM:-}" && "$PR_NUM" != "null" ]]; then
              echo "PR encontrada: #$PR_NUM"
              echo "PR_NUM=$PR_NUM" >> "$GITHUB_ENV"
              break
            fi
            echo "  PR ainda não criada, aguardando…"
            sleep 10
          done
          if [[ -z "${PR_NUM:-}" || "$PR_NUM" == "null" ]]; then
            echo "::error::PR develop->main não foi criada pela Lambda OpenPR"
            exit 1
          fi

      - name: Merge PR
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FOR_MERGE }}
        run: gh pr merge --repo "${{ github.repository }}" "$PR_NUM" --merge

      - name: Trigger prod pipeline
        run: |
          set -euo pipefail
          aws codepipeline start-pipeline-execution \
            --name "${APP_NAME}-prod" --query 'pipelineExecutionId' --output text

  # =========================================================================
  # FLUXO HOTFIX
  # =========================================================================
  hotfix-deploy:
    needs: decide
    if: needs.decide.outputs.operation == 'hotfix'
    runs-on: ubuntu-latest
    environment: prod-hotfix
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.decide.outputs.hotfix_branch }}
          fetch-depth: 0
          token: ${{ secrets.GH_PAT_FOR_MERGE }}

      - name: Validate branch
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::A branch hotfix deve descender de main"; exit 1
          fi

      - name: Merge hotfix -> main
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FOR_MERGE }}
        run: |
          set -euo pipefail
          PR_NUM=$(gh pr list --repo "${{ github.repository }}" --base main \
            --head "${{ needs.decide.outputs.hotfix_branch }}" --json number --jq '.[0].number')
          [[ -n "$PR_NUM" && "$PR_NUM" != "null" ]] || { echo "::error::PR não encontrada"; exit 1; }
          gh pr merge --repo "${{ github.repository }}" "$PR_NUM" --squash --delete-branch

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger prod pipeline (CodeBuild builda hotfix em main)
        run: aws codepipeline start-pipeline-execution --name "${APP_NAME}-prod"

      - name: Backmerge PR main -> develop
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FOR_MERGE }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y%m%d-%H%M%S)
          BACKMERGE="backmerge/hotfix-${DATE}"
          git fetch origin main develop
          git checkout -b "$BACKMERGE" origin/main
          git push origin "$BACKMERGE"
          gh pr create --repo "${{ github.repository }}" --base develop --head "$BACKMERGE" \
            --title "backmerge: hotfix ${DATE} (main -> develop)" \
            --body "Hotfix aplicado em prod. Sincronizando main para develop. Resolva conflitos se houver."

  # =========================================================================
  # FLUXO ROLLBACK
  # =========================================================================
  rollback:
    needs: decide
    if: needs.decide.outputs.operation == 'rollback'
    runs-on: ubuntu-latest
    environment: prod-rollback
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT_FOR_MERGE }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate image tag
        id: validate
        run: |
          set -euo pipefail
          TAG="${{ needs.decide.outputs.image_tag }}"
          [[ -n "$TAG" ]] || { echo "::error::image_tag obrigatório"; exit 1; }
          aws ecr describe-images --repository-name "$APP_NAME" --image-ids imageTag="$TAG" >/dev/null
          REPO_URI=$(aws ecr describe-repositories --repository-names "$APP_NAME" \
            --query 'repositories[0].repositoryUri' --output text)
          echo "tag=$TAG"            >> "$GITHUB_OUTPUT"
          echo "repo_uri=$REPO_URI"  >> "$GITHUB_OUTPUT"

      - name: Apply rollback to prod via ECS
        run: |
          ./.github/scripts/deploy-ecs-image.sh \
            "${APP_NAME}-prod" \
            "${{ steps.validate.outputs.repo_uri }}:${{ steps.validate.outputs.tag }}"

      - name: Tag commit as rollback marker
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FOR_MERGE }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y%m%d-%H%M%S)
          TAG_NAME="rollback-to-${{ steps.validate.outputs.tag }}-${DATE}"
          git fetch origin main
          git tag "$TAG_NAME" origin/main \
            -m "Rollback prod to ${{ steps.validate.outputs.tag }} on ${DATE} by ${{ github.actor }}"
          git push origin "$TAG_NAME"
