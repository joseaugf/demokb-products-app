name: Release and Deploy Prod

on:
  push:
    branches: [ main ]

permissions:
  contents: write      # criar tag/release
  id-token: write      # OIDC para assumir role na AWS
  pull-requests: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version (semver patch)
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)
          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            IFS='.' read -r MA MI PA <<< "${latest#v}"
            next="v${MA}.${MI}.$((PA+1))"
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Next version: $next"

      - name: Create Git tag
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.ver.outputs.next }}" -m "Release ${{ steps.ver.outputs.next }}"
          git push origin "${{ steps.ver.outputs.next }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.next }}
          name: ${{ steps.ver.outputs.next }}
          generate_release_notes: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region:    ${{ secrets.AWS_REGION }}

      - name: Trigger Prod CodePipeline
        shell: bash
        env:
          PIPELINE_NAME: ${{ secrets.PROD_PIPELINE_NAME }}
        run: |
          set -euo pipefail
          echo "Starting pipeline: $PIPELINE_NAME"
          aws codepipeline start-pipeline-execution --name "$PIPELINE_NAME"
