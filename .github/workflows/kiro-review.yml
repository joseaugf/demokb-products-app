name: Kiro Review

# Reusable workflow chamado pelo deploy.yml no fluxo feature.
# Roda Kiro CLI em modo headless contra o diff develop..qa para
# gerar um review automatizado e publicar como comentário + S3.
#
# Documentação Kiro headless: https://kiro.dev/docs/cli/headless/

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
      image_tag:
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  APP_NAME: ${{ github.event.repository.name }}

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Kiro API key from Secrets Manager
        id: kiro
        run: |
          KEY=$(aws secretsmanager get-secret-value \
            --secret-id demokb/kiro-api-key \
            --query SecretString --output text)
          echo "::add-mask::$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Install Kiro CLI
        id: install
        continue-on-error: true
        run: |
          set -euo pipefail
          # POC: Kiro CLI install sem login publico ainda nao disponivel.
          # Caminho: usar Strands Agents SDK (mais barato, mesmo Bedrock) ou
          # quando Kiro CLI release for publica, trocar este step.
          # Por ora, falha esperada e proximo step gera report mock.
          if curl -fsSL "https://cli.kiro.dev/install.sh" -o /tmp/kiro-install.sh; then
            bash /tmp/kiro-install.sh
            echo "$HOME/.kiro/bin" >> "$GITHUB_PATH"
            echo "installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Kiro CLI install endpoint nao disponivel ainda; gerando review mock."
            echo "installed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute diff develop..qa
        id: diff
        run: |
          set -euo pipefail
          # Pega a tag/imagem que está atualmente em qa para diff
          QA_SHA=$(git rev-parse origin/qa 2>/dev/null || echo "")
          DEV_SHA="${{ inputs.commit_sha }}"

          mkdir -p /tmp/kiro-context

          if [[ -n "$QA_SHA" ]]; then
            git diff "$QA_SHA".."$DEV_SHA" > /tmp/kiro-context/changes.diff
          else
            # Primeira vez: faz diff contra main
            git diff origin/main.."$DEV_SHA" > /tmp/kiro-context/changes.diff
          fi

          # Lista de arquivos alterados (limita a 50 pra não estourar contexto)
          git diff --name-only "${QA_SHA:-origin/main}".."$DEV_SHA" | head -50 \
            > /tmp/kiro-context/changed-files.txt

          echo "files=$(wc -l < /tmp/kiro-context/changed-files.txt)" >> "$GITHUB_OUTPUT"
          echo "lines=$(wc -l < /tmp/kiro-context/changes.diff)" >> "$GITHUB_OUTPUT"

      - name: Run Kiro headless review
        id: review
        env:
          KIRO_API_KEY: ${{ steps.kiro.outputs.key }}
          KIRO_INSTALLED: ${{ steps.install.outputs.installed }}
        run: |
          set -euo pipefail
          if [[ "${KIRO_INSTALLED}" != "true" ]]; then
            cat > /tmp/kiro-report.md <<EOF
          ## Sumário
          (POC) Kiro CLI ainda não está disponível publicamente para instalação automatizada.
          Diff em \`/tmp/kiro-context/changes.diff\` ($(wc -l < /tmp/kiro-context/changes.diff) linhas).
          Arquivos alterados ($(wc -l < /tmp/kiro-context/changed-files.txt)):

          \`\`\`
          $(cat /tmp/kiro-context/changed-files.txt)
          \`\`\`

          ## Veredito
          VEREDITO: WARN (Kiro CLI install pendente — review manual recomendado)
          EOF
            echo "verdict=VEREDITO: WARN (Kiro CLI install pendente)" >> "$GITHUB_OUTPUT"
            echo "report_path=/tmp/kiro-report.md" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PROMPT=$(cat <<'EOF'
          Você é um senior software engineer fazendo code review automatizado de um deploy.
          Estamos no momento entre develop e qa. Analise o diff em /tmp/kiro-context/changes.diff
          e a lista de arquivos /tmp/kiro-context/changed-files.txt.

          Produza um relatório em **markdown** com as seguintes seções, nessa ordem:

          ## Sumário
          1-2 parágrafos com o que mudou e por que.

          ## Bugs potenciais
          Lista de até 5 problemas que podem causar bug em produção. Cite arquivo:linha.
          Se nada relevante: escreva "Nenhum encontrado.".

          ## Segurança
          Vulnerabilidades, secrets expostos, validação de input. Se OK: "Sem problemas detectados."

          ## Cobertura de testes
          Avalie se as mudanças têm cobertura adequada. "OK", "Parcial" ou "Insuficiente" + motivo.

          ## Sugestões de melhoria
          Até 3 itens curtos. Não invente sugestões se o código está limpo.

          ## Veredito
          Uma única linha, exatamente em um destes formatos:
          - VEREDITO: OK
          - VEREDITO: WARN (motivo curto)
          - VEREDITO: BLOCK (motivo curto)

          Seja conciso. Use bullets curtos. NUNCA invente arquivos ou linhas.
          EOF
          )

          kiro --no-interactive --trust-all-tools \
            --prompt "$PROMPT" > /tmp/kiro-report.md 2> /tmp/kiro-stderr.log || {
              echo "::warning::Kiro review falhou. Marcando como WARN."
              cat > /tmp/kiro-report.md <<EOF2
          ## Veredito
          VEREDITO: WARN (kiro review failed - check stderr)

          ## Erro
          \`\`\`
          $(tail -50 /tmp/kiro-stderr.log)
          \`\`\`
          EOF2
            }

          echo "report_path=/tmp/kiro-report.md" >> "$GITHUB_OUTPUT"
          VEREDITO=$(grep -oE 'VEREDITO: (OK|WARN|BLOCK)[^$]*' /tmp/kiro-report.md | head -1 || echo "VEREDITO: WARN (sem veredito)")
          echo "verdict=$VEREDITO" >> "$GITHUB_OUTPUT"

      - name: Upload report to S3
        run: |
          DATE=$(date -u +%Y/%m/%d)
          BUCKET="demokb-deploy-reports-$(aws sts get-caller-identity --query Account --output text)"
          KEY="reviews/${APP_NAME}/${DATE}/${{ inputs.image_tag }}.md"
          aws s3 cp /tmp/kiro-report.md "s3://${BUCKET}/${KEY}"
          echo "Report URL: https://s3.${AWS_REGION}.amazonaws.com/${BUCKET}/${KEY}"
          echo "S3_BUCKET=$BUCKET" >> "$GITHUB_ENV"
          echo "S3_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Comment on related PR (if any)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FOR_MERGE }}
        run: |
          # Procura PR aberto da última feature branch que mergeou em develop
          LAST_PR=$(gh pr list --base develop --state merged --limit 1 --json number,headRefName \
            --jq '.[0].number // empty')
          if [[ -n "$LAST_PR" ]]; then
            REPORT=$(cat /tmp/kiro-report.md)
            gh pr comment "$LAST_PR" --body "## 🤖 Kiro Review (deploy ${{ inputs.image_tag }})

          ${{ steps.review.outputs.verdict }}

          [Relatório completo](https://s3.${AWS_REGION}.amazonaws.com/${S3_BUCKET}/${S3_KEY})

          <details><summary>Ver inline</summary>

          ${REPORT}
          </details>
          "
          fi

      - name: Surface verdict to job summary
        run: |
          {
            echo "# Kiro Review"
            echo ""
            echo "**${{ steps.review.outputs.verdict }}**"
            echo ""
            cat /tmp/kiro-report.md
          } >> "$GITHUB_STEP_SUMMARY"
