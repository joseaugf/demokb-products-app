name: Dispatch Rollback

# Dispara o CodePipeline <repo>-rollback com a tag escolhida.
# Pipeline AWS faz validate -> approval (gateado pelo approval-bridge no
# Environment prod-rollback) -> register-task-definition + update-service.
#
# Como usar:
#   1. Action "Dispatch Rollback" -> Run workflow
#   2. Escolhe a image_tag (use a Action "List ECR Tags" para ver as opções)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag da imagem ECR para aplicar em prod"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  REPO_NAME: ${{ github.event.repository.name }}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate tag exists
        shell: bash
        run: |
          set -euo pipefail
          aws ecr describe-images --repository-name "$REPO_NAME" \
            --image-ids imageTag="${{ inputs.image_tag }}" >/dev/null
          echo "==> Tag ${{ inputs.image_tag }} OK"

      - name: Start rollback pipeline
        shell: bash
        run: |
          set -euo pipefail
          EXEC=$(aws codepipeline start-pipeline-execution \
            --name "${REPO_NAME}-rollback" \
            --variables "name=ImageTag,value=${{ inputs.image_tag }}" \
            --query 'pipelineExecutionId' --output text)
          echo "==> Rollback pipeline iniciada"
          echo "    Execution: $EXEC"
          echo "    Console: https://${AWS_REGION}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${REPO_NAME}-rollback/executions/${EXEC}/timeline"
          echo ""
          echo "    Aguarde a Approval_Rollback ficar pendente, depois aprove via approval-bridge no Environment prod-rollback."
