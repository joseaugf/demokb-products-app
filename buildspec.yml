# Build único, imutável. Roda SEM conhecer o ambiente de destino.
# O mesmo imagedefinitions.json é consumido pelas ações de deploy em dev, qa e prod.
#
# Variáveis esperadas (setadas no CodeBuild Project):
#   AWS_DEFAULT_REGION    (ex.: us-east-1)
#   AWS_ACCOUNT_ID
#   IMAGE_REPO_NAME       (nome do repo ECR, ex.: demokb-products-app)
#   CONTAINER_NAME        (nome do container na task def, ex.: app)
version: 0.2

env:
  shell: bash

phases:
  pre_build:
    commands:
      - OPERATION="${OPERATION:-feature}"
      - |
        if [ "$OPERATION" = "rollback" ]; then
          echo "==> SKIP Build (operation=rollback, usa imagem existente)"
          mkdir -p /tmp/out && echo '[]' > /tmp/out/imagedefinitions.json
          exit 0
        fi
      - echo "[pre_build] Logging in to Amazon ECR..."
      - aws --version
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
      - COMMIT_HASH=$(echo "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c1-7)
      - IMAGE_TAG=${COMMIT_HASH:=latest}
      - REPOSITORY_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME"
      - echo "REPOSITORY_URI=$REPOSITORY_URI  IMAGE_TAG=$IMAGE_TAG"

  build:
    commands:
      - echo "[build] Building Docker image..."
      - docker build -t "$REPOSITORY_URI:$IMAGE_TAG" .
      # Tags adicionais para rastreabilidade (não são usadas pelo deploy)
      - docker tag "$REPOSITORY_URI:$IMAGE_TAG" "$REPOSITORY_URI:latest"

  post_build:
    commands:
      - echo "[post_build] Pushing image to ECR..."
      - docker push "$REPOSITORY_URI:$IMAGE_TAG"
      - docker push "$REPOSITORY_URI:latest"
      - echo "[post_build] Writing imagedefinitions.json (same artifact for dev/qa/prod)..."
      - printf '[{"name":"%s","imageUri":"%s"}]' "$CONTAINER_NAME" "$REPOSITORY_URI:$IMAGE_TAG" > imagedefinitions.json
      - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
  discard-paths: yes
