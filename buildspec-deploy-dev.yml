version: 0.2

# Deploy Dev: atualiza o ECS service de dev com a imagem buildada.
# Só roda em Operation=feature. Hotfix e rollback fazem skip.

env:
  shell: bash

phases:
  build:
    commands:
      - OPERATION="${OPERATION:-feature}"
      - |
        if [ "$OPERATION" != "feature" ]; then
          echo "==> SKIP Deploy Dev (operation=$OPERATION)"
          exit 0
        fi
      - echo "==> Deploying to dev"
      - REPO_URI=$(aws ecr describe-repositories --repository-names "$APP_NAME" --query 'repositories[0].repositoryUri' --output text)
      - TAG=$(git rev-parse HEAD | cut -c 1-12)
      - IMAGE="${REPO_URI}:${TAG}"
      - echo "    Image=$IMAGE Service=${APP_NAME}-dev"
      - |
        CURRENT_TD=$(aws ecs describe-task-definition --task-definition "${APP_NAME}-dev" --query 'taskDefinition' --output json)
        NEW_TD=$(echo "$CURRENT_TD" | jq --arg img "$IMAGE" --arg cn "$CONTAINER_NAME" '
          .containerDefinitions |= map(if .name == $cn then .image = $img else . end)
          | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
        ')
        echo "$NEW_TD" > /tmp/td.json
        NEW_ARN=$(aws ecs register-task-definition --cli-input-json file:///tmp/td.json --query 'taskDefinition.taskDefinitionArn' --output text)
        aws ecs update-service --cluster "$CLUSTER_NAME" --service "${APP_NAME}-dev" --task-definition "$NEW_ARN" --output table
      - echo "==> Dev deploy initiated"

artifacts:
  files:
    - '**/*'
